<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pixel Siege</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #0d0b14;
      overflow: hidden;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    canvas {
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      cursor: none;
      box-shadow: 0 0 0 4px #2a2440, 0 0 40px rgba(0, 0, 0, 0.6);
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>

  <script>
    // ---------- Setup ----------
    const W = 480, H = 320;
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    canvas.width = W;
    canvas.height = H;
    ctx.imageSmoothingEnabled = false;

    function resize() {
      const s = Math.min(innerWidth / W, innerHeight / H) * 0.96;
      canvas.style.width = W * s + "px";
      canvas.style.height = H * s + "px";
    }
    addEventListener("resize", resize);
    resize();

    const PALETTE = {
      floorA: "#2b2540", floorB: "#2f2846", speck: "#3a3256",
      skin: "#f2c79b", shirt: "#3d7be0", shirtDark: "#2a58a8", pants: "#3a3248",
      gun: "#c9c9d6", bullet: "#ffe066", muzzle: "#fff3b0",
      grunt: "#5fd068", gruntDark: "#3c9a47",
      runner: "#ff7a45", runnerDark: "#c44f22",
      tank: "#a067e0", tankDark: "#6f3fae",
      heart: "#ff4d6d", text: "#f4f1ff", muted: "#9d93c4", accent: "#ffe066",
    };

    // ---------- Input ----------
    const keys = new Set();
    const mouse = { x: W / 2, y: H / 2, down: false, clicked: false };

    addEventListener("keydown", e => {
      if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", " "].includes(e.key)) e.preventDefault();
      keys.add(e.key.toLowerCase());
      if ((e.key === "p" || e.key === "Escape") && (state === "playing" || state === "paused")) {
        state = state === "playing" ? "paused" : "playing";
      }
    });
    addEventListener("keyup", e => keys.delete(e.key.toLowerCase()));
    addEventListener("blur", () => { keys.clear(); mouse.down = false; });

    function toCanvas(e) {
      const r = canvas.getBoundingClientRect();
      mouse.x = ((e.clientX - r.left) / r.width) * W;
      mouse.y = ((e.clientY - r.top) / r.height) * H;
    }
    addEventListener("mousemove", toCanvas);
    canvas.addEventListener("mousedown", e => { toCanvas(e); mouse.down = true; mouse.clicked = true; });
    addEventListener("mouseup", () => (mouse.down = false));
    canvas.addEventListener("contextmenu", e => e.preventDefault());

    const held = (...names) => names.some(n => keys.has(n));

    // ---------- High score (optional storage) ----------
    function loadBest() { try { return +localStorage.getItem("pixelSiegeBest") || 0; } catch { return 0; } }
    function saveBest(v) { try { localStorage.setItem("pixelSiegeBest", v); } catch {} }
    let best = loadBest();

    // ---------- Floor (pre-rendered) ----------
    const floor = document.createElement("canvas");
    floor.width = W; floor.height = H;
    (() => {
      const f = floor.getContext("2d");
      const T = 16;
      for (let y = 0; y < H; y += T)
        for (let x = 0; x < W; x += T) {
          f.fillStyle = (x / T + y / T) % 2 ? PALETTE.floorA : PALETTE.floorB;
          f.fillRect(x, y, T, T);
        }
      f.fillStyle = PALETTE.speck;
      for (let i = 0; i < 260; i++) f.fillRect((Math.random() * W) | 0, (Math.random() * H) | 0, 1, 1);
    })();

    // ---------- Game state ----------
    const ENEMY_TYPES = {
      grunt:  { hp: 1, speed: 34, r: 6, color: PALETTE.grunt,  dark: PALETTE.gruntDark,  points: 10, size: 1 },
      runner: { hp: 1, speed: 62, r: 5, color: PALETTE.runner, dark: PALETTE.runnerDark, points: 15, size: 0.8 },
      tank:   { hp: 5, speed: 20, r: 9, color: PALETTE.tank,   dark: PALETTE.tankDark,   points: 40, size: 1.5 },
    };

    let state = "menu"; // menu | playing | paused | levelClear | gameOver
    let player, bullets, enemies, particles, floaters;
    let level, score, kills, killsNeeded, spawned, spawnTimer, shake, time, bannerTimer;

    function newGame() {
      score = 0;
      level = 1;
      player = { x: W / 2, y: H / 2, r: 5, hp: 5, maxHp: 5, speed: 90, cooldown: 0, invuln: 0, walk: 0, moving: false, flash: 0 };
      startLevel();
    }

    function startLevel() {
      bullets = []; enemies = []; particles = []; floaters = [];
      kills = 0;
      spawned = 0;
      killsNeeded = 6 + level * 4;
      spawnTimer = 1;
      shake = 0;
      bannerTimer = 2;
      state = "playing";
    }

    function spawnEnemy() {
      const pool = ["grunt"];
      if (level >= 2) pool.push("runner");
      if (level >= 3) pool.push("tank");
      if (level >= 5) pool.push("runner", "grunt");
      const kind = pool[(Math.random() * pool.length) | 0];
      const t = ENEMY_TYPES[kind];

      // Come in from a random edge
      const side = (Math.random() * 4) | 0, m = 14;
      const x = side === 0 ? -m : side === 1 ? W + m : Math.random() * W;
      const y = side === 2 ? -m : side === 3 ? H + m : Math.random() * H;

      const speedScale = 1 + (level - 1) * 0.08;
      enemies.push({ kind, x, y, hp: t.hp, maxHp: t.hp, r: t.r, speed: t.speed * speedScale * (0.85 + Math.random() * 0.3), anim: Math.random() * 10, hit: 0 });
      spawned++;
    }

    function burst(x, y, color, n = 10, spd = 80) {
      for (let i = 0; i < n; i++) {
        const a = Math.random() * Math.PI * 2, s = spd * (0.3 + Math.random() * 0.7);
        particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.4 + Math.random() * 0.4, color, size: Math.random() < 0.3 ? 2 : 1 });
      }
    }

    // ---------- Update ----------
    function update(dt) {
      time += dt;
      if (state !== "playing") return;

      if (bannerTimer > 0) bannerTimer -= dt;

      // Player movement
      let dx = 0, dy = 0;
      if (held("arrowleft", "a")) dx -= 1;
      if (held("arrowright", "d")) dx += 1;
      if (held("arrowup", "w")) dy -= 1;
      if (held("arrowdown", "s")) dy += 1;
      player.moving = dx || dy;
      if (player.moving) {
        const len = Math.hypot(dx, dy);
        player.x = Math.max(6, Math.min(W - 6, player.x + (dx / len) * player.speed * dt));
        player.y = Math.max(8, Math.min(H - 8, player.y + (dy / len) * player.speed * dt));
        player.walk += dt * 10;
      }
      player.invuln = Math.max(0, player.invuln - dt);
      player.flash = Math.max(0, player.flash - dt);

      // Shooting
      player.cooldown -= dt;
      if (mouse.down && player.cooldown <= 0) {
        const a = Math.atan2(mouse.y - player.y, mouse.x - player.x);
        const spread = (Math.random() - 0.5) * 0.06;
        bullets.push({ x: player.x + Math.cos(a) * 9, y: player.y + Math.sin(a) * 9, vx: Math.cos(a + spread) * 320, vy: Math.sin(a + spread) * 320, life: 1.2 });
        player.cooldown = 0.16;
        player.flash = 0.05;
      }

      // Bullets
      for (const b of bullets) {
        b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
        if (b.x < -10 || b.x > W + 10 || b.y < -10 || b.y > H + 10) b.life = 0;
      }

      // Spawning
      spawnTimer -= dt;
      const interval = Math.max(0.3, 1.3 - level * 0.12);
      if (spawnTimer <= 0 && spawned < killsNeeded && bannerTimer <= 0.5) {
        spawnEnemy();
        spawnTimer = interval * (0.6 + Math.random() * 0.8);
      }

      // Enemies
      for (const e of enemies) {
        const a = Math.atan2(player.y - e.y, player.x - e.x);
        e.x += Math.cos(a) * e.speed * dt;
        e.y += Math.sin(a) * e.speed * dt;
        e.anim += dt * (e.speed / 8);
        e.hit = Math.max(0, e.hit - dt);

        // Bullet hits
        for (const b of bullets) {
          if (b.life > 0 && Math.hypot(b.x - e.x, b.y - e.y) < e.r + 2) {
            b.life = 0;
            e.hp--;
            e.hit = 0.08;
            e.x -= Math.cos(a) * 4; e.y -= Math.sin(a) * 4; // knockback
            burst(b.x, b.y, ENEMY_TYPES[e.kind].color, 4, 50);
            if (e.hp <= 0) {
              const pts = ENEMY_TYPES[e.kind].points * level;
              score += pts;
              kills++;
              burst(e.x, e.y, ENEMY_TYPES[e.kind].color, 16, 110);
              burst(e.x, e.y, "#ffffff", 4, 60);
              floaters.push({ x: e.x, y: e.y - 8, text: "+" + pts, life: 0.8 });
              shake = Math.max(shake, e.kind === "tank" ? 4 : 2);
            }
            break;
          }
        }

        // Touching the player
        if (e.hp > 0 && player.invuln <= 0 && Math.hypot(player.x - e.x, player.y - e.y) < e.r + player.r) {
          player.hp--;
          player.invuln = 1.2;
          shake = 6;
          burst(player.x, player.y, PALETTE.heart, 14, 100);
          player.x = Math.max(6, Math.min(W - 6, player.x + Math.cos(a) * 16));
          player.y = Math.max(8, Math.min(H - 8, player.y + Math.sin(a) * 16));
          if (player.hp <= 0) {
            state = "gameOver";
            if (score > best) { best = score; saveBest(best); }
          }
        }
      }

      enemies = enemies.filter(e => e.hp > 0);
      bullets = bullets.filter(b => b.life > 0);

      for (const p of particles) { p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.9; p.vy *= 0.9; p.life -= dt; }
      particles = particles.filter(p => p.life > 0);
      for (const f of floaters) { f.y -= 18 * dt; f.life -= dt; }
      floaters = floaters.filter(f => f.life > 0);

      shake = Math.max(0, shake - dt * 20);

      // Level complete
      if (kills >= killsNeeded && state === "playing") {
        state = "levelClear";
        player.hp = Math.min(player.maxHp, player.hp + 1);
        score += 100 * level;
      }
    }

    // ---------- Drawing helpers ----------
    function px(x, y, w, h, color) {
      ctx.fillStyle = color;
      ctx.fillRect(Math.round(x), Math.round(y), w, h);
    }

    function text(str, x, y, size = 8, color = PALETTE.text, align = "center") {
      ctx.font = `bold ${size}px "Courier New", monospace`;
      ctx.textAlign = align;
      ctx.textBaseline = "middle";
      ctx.fillStyle = "#000";
      ctx.fillText(str, x + 1, y + 1);
      ctx.fillStyle = color;
      ctx.fillText(str, x, y);
    }

    function drawPlayer() {
      const { x, y } = player;
      if (player.invuln > 0 && Math.floor(time * 20) % 2) return; // blink when hurt
      const aim = Math.atan2(mouse.y - y, mouse.x - x);
      const face = Math.cos(aim) >= 0 ? 1 : -1;
      const step = player.moving ? Math.round(Math.sin(player.walk)) : 0;

      // shadow
      ctx.fillStyle = "rgba(0,0,0,0.3)";
      ctx.fillRect(Math.round(x - 5), Math.round(y + 7), 10, 2);
      // legs
      px(x - 3, y + 3 + Math.max(0, step), 2, 4 - Math.max(0, step), PALETTE.pants);
      px(x + 1, y + 3 + Math.max(0, -step), 2, 4 - Math.max(0, -step), PALETTE.pants);
      // body
      px(x - 4, y - 3, 8, 7, PALETTE.shirt);
      px(x - 4, y + 2, 8, 2, PALETTE.shirtDark);
      // head
      px(x - 3, y - 9, 6, 6, PALETTE.skin);
      px(x - 3, y - 10, 6, 2, "#5a3a22"); // hair
      px(x + (face > 0 ? 1 : -2), y - 7, 1, 1, "#1b1b1b"); // eye

      // gun, drawn pixel by pixel along the aim direction
      const gx = x + face * 1, gy = y - 1;
      for (let i = 2; i < 10; i++) px(gx + Math.cos(aim) * i, gy + Math.sin(aim) * i, 2, 2, i < 4 ? "#6b6b78" : PALETTE.gun);
      if (player.flash > 0) {
        const mx = gx + Math.cos(aim) * 12, my = gy + Math.sin(aim) * 12;
        px(mx - 2, my - 2, 5, 5, PALETTE.muzzle);
      }
    }

    function drawEnemy(e) {
      const t = ENEMY_TYPES[e.kind];
      const s = t.size;
      const bob = Math.round(Math.sin(e.anim) * 1);
      const body = e.hit > 0 ? "#ffffff" : t.color;
      const dark = e.hit > 0 ? "#dddddd" : t.dark;
      const w = Math.round(12 * s), h = Math.round(10 * s);
      const x = e.x - w / 2, y = e.y - h / 2 + bob;

      ctx.fillStyle = "rgba(0,0,0,0.3)";
      ctx.fillRect(Math.round(e.x - w / 2), Math.round(e.y + h / 2), w, 2);

      // body (blob with feet)
      px(x + 1, y, w - 2, h - 2, body);
      px(x, y + 2, w, h - 4, body);
      px(x + 1, y + h - 3, w - 2, 2, dark);
      const foot = Math.sin(e.anim * 1.5) > 0 ? 1 : 0;
      px(x + 1, y + h - 1 - foot, 3, 2, dark);
      px(x + w - 4, y + h - 2 + foot, 3, 2, dark);

      // eyes look at the player (or straight ahead on the menu)
      const target = player || { x: e.x + 10, y: e.y };
      const a = Math.atan2(target.y - e.y, target.x - e.x);
      const ex = Math.round(Math.cos(a) * 1.5), ey = Math.round(Math.sin(a) * 1.5);
      const eyeY = y + Math.round(h * 0.3);
      px(x + w * 0.25, eyeY, 3, 3, "#fff");
      px(x + w * 0.62, eyeY, 3, 3, "#fff");
      px(x + w * 0.25 + 1 + ex * 0.6, eyeY + 1 + ey * 0.6, 1, 1, "#111");
      px(x + w * 0.62 + 1 + ex * 0.6, eyeY + 1 + ey * 0.6, 1, 1, "#111");
      if (e.kind === "runner") px(x + w * 0.2, eyeY - 2, w * 0.6, 1, dark); // angry brow

      // health bar for tough enemies
      if (e.maxHp > 1 && e.hp < e.maxHp) {
        px(x, y - 4, w, 2, "#000");
        px(x, y - 4, Math.round((w * e.hp) / e.maxHp), 2, PALETTE.heart);
      }
    }

    function drawHeart(x, y, full) {
      const c = full ? PALETTE.heart : "#4a3f63";
      px(x + 1, y, 2, 1, c); px(x + 4, y, 2, 1, c);
      px(x, y + 1, 7, 2, c);
      px(x + 1, y + 3, 5, 1, c);
      px(x + 2, y + 4, 3, 1, c);
      px(x + 3, y + 5, 1, 1, c);
    }

    function drawCrosshair() {
      const x = Math.round(mouse.x), y = Math.round(mouse.y);
      const c = PALETTE.accent;
      px(x - 5, y, 3, 1, c); px(x + 3, y, 3, 1, c);
      px(x, y - 5, 1, 3, c); px(x, y + 3, 1, 3, c);
      px(x, y, 1, 1, "#fff");
    }

    function drawHUD() {
      for (let i = 0; i < player.maxHp; i++) drawHeart(6 + i * 9, 6, i < player.hp);
      text(`SCORE ${score}`, W - 6, 9, 8, PALETTE.text, "right");
      text(`LEVEL ${level}`, W / 2, 9, 8, PALETTE.accent);
      // progress bar
      const bw = 80, bx = W / 2 - bw / 2;
      px(bx, 16, bw, 3, "#000");
      px(bx, 16, Math.round((bw * Math.min(kills, killsNeeded)) / killsNeeded), 3, PALETTE.grunt);
    }

    function overlay(alpha = 0.6) {
      ctx.fillStyle = `rgba(13, 11, 20, ${alpha})`;
      ctx.fillRect(0, 0, W, H);
    }

    // ---------- Screens ----------
    function drawMenu() {
      ctx.drawImage(floor, 0, 0);
      // Parade of enemies in the background
      for (let i = 0; i < 6; i++) {
        const kind = ["grunt", "runner", "tank"][i % 3];
        const e = { kind, x: ((time * 30 + i * 90) % (W + 40)) - 20, y: 250 + (i % 2) * 18, hp: 1, maxHp: 1, anim: time * 6 + i, hit: 0 };
        drawEnemy(e);
      }
      overlay(0.45);
      const bounce = Math.round(Math.sin(time * 3) * 2);
      text("PIXEL SIEGE", W / 2, 70 + bounce, 32, PALETTE.accent);
      text("a tiny top-down shooter", W / 2, 100, 10, PALETTE.muted);

      text("ARROWS / WASD  move", W / 2, 140, 10);
      text("MOUSE  aim     CLICK  shoot", W / 2, 156, 10);
      text("P  pause", W / 2, 172, 10);

      if (Math.floor(time * 2) % 2) text("CLICK TO START", W / 2, 210, 14, PALETTE.text);
      if (best) text(`BEST ${best}`, W / 2, 232, 9, PALETTE.muted);
    }

    function drawGame() {
      ctx.save();
      if (shake > 0) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
      ctx.drawImage(floor, 0, 0);

      for (const p of particles) {
        ctx.globalAlpha = Math.min(1, p.life * 2);
        px(p.x, p.y, p.size, p.size, p.color);
      }
      ctx.globalAlpha = 1;

      // Draw things lower on screen in front
      const actors = [...enemies.map(e => ({ y: e.y, draw: () => drawEnemy(e) })), { y: player.y, draw: drawPlayer }];
      actors.sort((a, b) => a.y - b.y).forEach(a => a.draw());

      for (const b of bullets) {
        px(b.x - b.vx * 0.012, b.y - b.vy * 0.012, 1, 1, "#b89a2e");
        px(b.x - 1, b.y - 1, 2, 2, PALETTE.bullet);
      }
      for (const f of floaters) {
        ctx.globalAlpha = Math.min(1, f.life * 2);
        text(f.text, f.x, f.y, 8, PALETTE.accent);
      }
      ctx.globalAlpha = 1;
      ctx.restore();

      drawHUD();

      if (bannerTimer > 0 && state === "playing") {
        text(`LEVEL ${level}`, W / 2, H / 2 - 20, 24, PALETTE.accent);
        text(`defeat ${killsNeeded} enemies`, W / 2, H / 2 + 4, 10, PALETTE.text);
      }
    }

    function drawPaused() {
      overlay(0.6);
      text("PAUSED", W / 2, H / 2 - 8, 24, PALETTE.accent);
      text("press P to resume", W / 2, H / 2 + 16, 10, PALETTE.muted);
    }

    function drawLevelClear() {
      overlay(0.6);
      text(`LEVEL ${level} CLEAR!`, W / 2, H / 2 - 30, 24, PALETTE.accent);
      text(`+${100 * level} bonus   +1 heart`, W / 2, H / 2, 10, PALETTE.text);
      text(`next: level ${level + 1}${level + 1 === 2 ? " - fast runners incoming" : level + 1 === 3 ? " - tanks incoming" : ""}`, W / 2, H / 2 + 18, 9, PALETTE.muted);
      if (Math.floor(time * 2) % 2) text("CLICK TO CONTINUE", W / 2, H / 2 + 48, 12);
    }

    function drawGameOver() {
      overlay(0.7);
      text("GAME OVER", W / 2, H / 2 - 40, 28, PALETTE.heart);
      text(`score ${score}   level ${level}`, W / 2, H / 2 - 8, 12, PALETTE.text);
      text(score >= best && score > 0 ? "NEW BEST!" : `best ${best}`, W / 2, H / 2 + 12, 10, score >= best && score > 0 ? PALETTE.accent : PALETTE.muted);
      if (Math.floor(time * 2) % 2) text("CLICK TO PLAY AGAIN", W / 2, H / 2 + 46, 12);
    }

    // ---------- Main loop ----------
    time = 0;
    let last = performance.now();
    function frame(now) {
      const dt = Math.min(0.05, (now - last) / 1000);
      last = now;

      if (mouse.clicked) {
        if (state === "menu" || state === "gameOver") { newGame(); mouse.down = false; }
        else if (state === "levelClear") { level++; startLevel(); mouse.down = false; }
        mouse.clicked = false;
      }

      update(dt);

      ctx.clearRect(0, 0, W, H);
      if (state === "menu") drawMenu();
      else {
        drawGame();
        if (state === "paused") drawPaused();
        if (state === "levelClear") drawLevelClear();
        if (state === "gameOver") drawGameOver();
      }
      drawCrosshair();
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  </script>
</body>
</html>
